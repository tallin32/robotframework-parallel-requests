[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-parallel-requests"
version = "0.1.0"
description = "Parallelized HTTP Request library for Robot Framework (httpx + ThreadPool MVP)"
requires-python = ">=3.8"
dependencies = [
    "httpx>=0.23.0",
    "robotframework>=4.0",
    "respx>=0.20.0",
    "pytest>=7.0",
]


