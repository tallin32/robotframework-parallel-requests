[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "robotframework-parallel-requests"
version = "0.1.0"
description = "Parallelized HTTP Request library for Robot Framework (httpx + ThreadPool MVP)"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Tallin Carlson"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: Robot Framework",
    "Framework :: Robot Framework :: Library",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "httpx>=0.23.0",
    "robotframework>=4.0",
]

[project.optional-dependencies]
dev = [
    "respx>=0.20.0",
    "pytest>=7.0",
    "build",
    "twine",
]

[project.urls]
Homepage = "https://github.com/tallin32/robotframework-parallel-requests"
Repository = "https://github.com/tallin32/robotframework-parallel-requests"
Issues = "https://github.com/tallin32/robotframework-parallel-requests/issues"


