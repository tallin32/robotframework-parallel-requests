name: Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        python-version: [ "3.8", "3.9", "3.10", "3.11", "3.12", "3.13" ]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Run pytest
      run: |
        pytest tests/ -v --tb=short

  robot-local-api:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install -e .

    - name: Start local test API
      run: |
        python scripts/local_test_api.py --host 127.0.0.1 --port 18080 > local-test-api.log 2>&1 &
        echo $! > local-test-api.pid

    - name: Wait for API readiness
      run: |
        python - <<'PY'
        import json
        import time
        import urllib.request

        url = "http://127.0.0.1:18080/health"
        for _ in range(60):
            try:
                with urllib.request.urlopen(url, timeout=1) as resp:
                    data = json.loads(resp.read().decode("utf-8"))
                    if resp.status == 200 and data.get("ok"):
                        print("Local test API is ready")
                        raise SystemExit(0)
            except Exception:
                time.sleep(0.25)

        raise SystemExit("Local test API did not become ready in time")
        PY

    - name: Run Robot integration tests
      run: |
        robot --variable BASE_URL:http://127.0.0.1:18080 --outputdir robot-results tests/robot/local_api.robot

    - name: Upload Robot output
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: robot-local-api-results
        path: robot-results/*
        retention-days: 14

    - name: Show local API logs on failure
      if: failure()
      run: |
        cat local-test-api.log

    - name: Stop local test API
      if: always()
      run: |
        if [ -f local-test-api.pid ]; then
          kill "$(cat local-test-api.pid)" || true
        fi

